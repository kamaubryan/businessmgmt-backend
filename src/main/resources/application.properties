spring.application.name=BusinessSystem

spring.datasource.url=jdbc:postgresql://localhost:5460/employee_system
spring.datasource.username=root
spring.datasource.password=root

spring.jpa.hibernate.ddl-auto=update
spring.jpa.properties.hibernate.globally_quoted_identifiers=true
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.open-in-view=false

server.port=8087
spring.web.mvc.trailing-slash-match=true

spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

app.upload-dir=./uploads

app.bootstrap.supervisor-email=admin@business.local
app.bootstrap.supervisor-password=admin123

logging.level.org.hibernate.SQL=DEBUG
logging.level.org.springframework.web=DEBUG
logging.level.org.hibernate.type.descriptor.sql=TRACE
